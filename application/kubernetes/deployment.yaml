apiVersion: apps/v1
kind: Deployment
metadata:
  name: welcome-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: welcome-app
  template:
    metadata:
      labels:
        app: welcome-app
    spec:
      containers:
      - name: welcome-app-container
        # IMPORTANTE: Reemplaza esta URL con la de tu Artifact Registry
        # Formato: <region>-docker.pkg.dev/<project-id>/<repo-name>/<image-name>:<tag>
        image: us-central1-docker.pkg.dev/elite-buttress-472417-g3/potential-guacamole-repo/welcome-app:1.0.4
        ports:
        - containerPort: 8080